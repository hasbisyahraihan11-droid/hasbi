<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live2D Face Tracking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui">
  <button id="btnCam">📷 Nyalain Kamera</button>
  <button id="btnExp">😊 Ganti Ekspresi</button>
  <button id="btnMotion">👋 Gerakan</button>
  <label><input type="checkbox" id="mirror" checked> Mirror</label>
  <span id="status">Loading model...</span>
</div>
<video id="cam" playsinline muted></video>

<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
