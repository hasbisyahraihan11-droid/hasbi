<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live2D Lip Sync</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui">
  <button id="btnMic">🎤 Mic</button>
  <button id="btnFile">🔊 Audio</button>
  <input type="file" id="file" accept="audio/*" hidden>
  <input id="text" placeholder="Ketik biar karakter ngomong..." value="Halo! Aku karakter Live2D kamu.">
  <button id="btnSpeak">💬 Bicara</button>
  <button id="btnExp">😊 Ekspresi</button>
  <span id="status">Loading model...</span>
</div>

<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script src="main.js"></script>
</body>
</html>
